<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14231a">
<title>Food Inventory</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  background: #101713;
  color: #eef5ef;
}

header {
  padding: 22px 18px;
  background: #192720;
  border-bottom: 1px solid #304235;
}

header h1 { margin: 0; font-size: 27px; }

header p {
  color: #a2b5a5;
  margin: 5px 0 0;
}

main {
  max-width: 720px;
  margin: auto;
  padding: 15px;
}

.card {
  background: #19241d;
  border: 1px solid #304235;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 15px;
}

h2 { font-size: 19px; margin-top: 0; }

button, input, select {
  font: inherit;
  border-radius: 10px;
  padding: 12px;
}

button {
  background: #82d69a;
  color: #102016;
  font-weight: 700;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
}

button:active { transform: scale(.98); }

button.secondary {
  background: #2a392e;
  color: #e6eee7;
}

button.danger {
  background: #573035;
  color: #ffdddd;
}

input, select {
  background: #101713;
  color: white;
  border: 1px solid #405544;
  width: 100%;
  outline: none;
}

input:focus, select:focus { border-color: #82d69a; }

.row {
  display: flex;
  gap: 9px;
  align-items: center;
}

.row > * { min-width: 0; }
.row input { flex: 1; }

.stats { display: flex; gap: 10px; }

.stat {
  flex: 1;
  background: #243329;
  border-radius: 12px;
  padding: 14px;
}

.stat strong {
  display: block;
  font-size: 26px;
}

.stat span {
  color: #a8b9aa;
  font-size: 13px;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
  background: #090d0a;
}

#reader video {
  width: 100% !important;
  object-fit: contain;
  border-radius: 12px;
  max-height: 60vh;
}

#cameraSelect { margin: 10px 0; }

#scanStatus {
  min-height: 22px;
  margin-top: 10px;
  color: #83d69a;
  overflow-wrap: anywhere;
}

#scanStatus.error { color: #ff9797; }

.product {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid #304235;
}

.product:last-child { border-bottom: none; }

.product-info {
  flex: 1;
  min-width: 0;
}

.product-info strong {
  display: block;
  overflow-wrap: anywhere;
}

.product-info small {
  display: block;
  color: #9eb3a2;
  overflow-wrap: anywhere;
  margin-top: 3px;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 7px;
}

.quantity button {
  padding: 8px 12px;
  min-width: 38px;
}

.quantity span {
  min-width: 24px;
  text-align: center;
  font-weight: bold;
}

.hidden { display: none !important; }

.modal {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0,0,0,.78);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal-content {
  width: 100%;
  max-width: 430px;
  background: #19241d;
  border: 1px solid #405544;
  border-radius: 18px;
  padding: 20px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-content h2 { margin-top: 0; }

.modal-content label {
  display: block;
  margin: 13px 0 6px;
}

.modal-content button {
  width: 100%;
  margin-top: 12px;
}

footer {
  text-align: center;
  color: #819284;
  font-size: 12px;
  padding: 20px;
}

.empty {
  color: #9eb3a2;
  padding: 12px 0;
}

@media (max-width: 420px) {
  main { padding: 11px; }
  .card { padding: 13px; }
  header h1 { font-size: 24px; }
}
</style>
</head>

<body>

<header>
  <h1>🥫 Food Inventory</h1>
  <p>Your household stock tracker</p>
</header>

<main>

  <section class="card">
    <div class="stats">
      <div class="stat">
        <strong id="productCount">0</strong>
        <span>Products</span>
      </div>
      <div class="stat">
        <strong id="totalCount">0</strong>
        <span>Total items</span>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>📷 Barcode Scanner</h2>

    <div id="reader"></div>

    <label for="cameraSelect" style="display:block;margin-top:12px">
      Camera
    </label>
    <select id="cameraSelect">
      <option value="">Detecting cameras...</option>
    </select>

    <div class="row" style="margin-top:10px">
      <button id="startCamera" style="flex:1">Start camera</button>
      <button id="stopCamera" class="secondary" style="flex:1">Stop</button>
    </div>

    <div id="scanStatus">Camera is stopped.</div>
  </section>

  <section class="card">
    <h2>⌨️ Enter barcode manually</h2>
    <div class="row">
      <input id="manualBarcode"
             placeholder="Barcode number"
             inputmode="numeric"
             autocomplete="off">
      <button id="manualSubmit">Scan</button>
    </div>
  </section>

  <section class="card">
    <h2>📦 Inventory</h2>
    <input id="search" placeholder="Search products..." autocomplete="off">
    <div id="inventoryList"></div>
  </section>

  <section class="card">
    <h2>💾 Database backup</h2>
    <p style="color:#a8b9aa">
      Download your inventory or restore it from a JSON backup.
    </p>

    <div class="row">
      <button id="exportBtn" style="flex:1">Export</button>
      <button id="importBtn" class="secondary" style="flex:1">Import</button>
    </div>

    <input type="file" id="fileInput" accept=".json,application/json" class="hidden">
  </section>

</main>

<footer>Food Inventory · Saved on this device</footer>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <h2>🆕 New product</h2>
    <p id="newBarcode" style="color:#83d69a;overflow-wrap:anywhere"></p>

    <label for="productName">Product name</label>
    <input id="productName" placeholder="e.g. Baked Beans" autocomplete="off">

    <label for="productQuantity">Starting quantity</label>
    <input id="productQuantity" type="number" min="0" step="1" value="1">

    <button id="saveProduct">Save product</button>
    <button id="cancelProduct" class="secondary">Cancel</button>
  </div>
</div>

<script>
"use strict";

const STORAGE_KEY = "foodInventory_v2";

let inventory = loadDatabase();
let scanner = null;
let scannerControls = null;
let cameraRunning = false;
let pendingBarcode = null;
let cameras = [];
let scanCooldown = {};

const $ = id => document.getElementById(id);

// DATABASE

function loadDatabase() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);

    const old = localStorage.getItem("foodInventory_v1");
    if (old) {
      const parsed = JSON.parse(old);
      localStorage.setItem(STORAGE_KEY, old);
      return parsed;
    }
  } catch (err) {
    console.error("Database load error:", err);
  }
  return {};
}

function saveDatabase() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
    render();
  } catch (err) {
    alert("Unable to save data. Your browser storage may be full.");
    console.error(err);
  }
}

// DISPLAY

function render() {
  const products = Object.values(inventory);

  $("productCount").textContent = products.length;

  const total = products.reduce((sum, p) => {
    return sum + (Number(p.quantity) || 0);
  }, 0);

  $("totalCount").textContent = total;

  const searchTerm = $("search").value.toLowerCase().trim();
  const list = $("inventoryList");
  list.innerHTML = "";

  const filtered = products
    .filter(p =>
      (p.name || "").toLowerCase().includes(searchTerm) ||
      String(p.barcode || "").includes(searchTerm)
    )
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">No products found.</div>';
    return;
  }

  filtered.forEach(product => {
    const row = document.createElement("div");
    row.className = "product";

    const info = document.createElement("div");
    info.className = "product-info";

    const name = document.createElement("strong");
    name.textContent = product.name;

    const barcode = document.createElement("small");
    barcode.textContent = "Barcode: " + product.barcode;

    info.appendChild(name);
    info.appendChild(barcode);

    const controls = document.createElement("div");
    controls.className = "quantity";

    const minus = document.createElement("button");
    minus.className = "secondary";
    minus.textContent = "−";
    minus.setAttribute("aria-label", "Remove one");
    minus.onclick = () => changeQuantity(product.barcode, -1);

    const amount = document.createElement("span");
    amount.textContent = product.quantity;

    const plus = document.createElement("button");
    plus.textContent = "+";
    plus.setAttribute("aria-label", "Add one");
    plus.onclick = () => changeQuantity(product.barcode, 1);

    controls.append(minus, amount, plus);
    row.append(info, controls);
    list.appendChild(row);
  });
}

function changeQuantity(barcode, amount) {
  const product = inventory[barcode];
  if (!product) return;

  product.quantity = Math.max(0, Number(product.quantity || 0) + amount);
  saveDatabase();
}

// STATUS

function setStatus(text, isError = false) {
  $("scanStatus").textContent = text;
  $("scanStatus").classList.toggle("error", isError);
}

// BARCODE HANDLING

function handleBarcode(rawBarcode) {
  const barcode = String(rawBarcode).trim();
  if (!barcode) return;

  const now = Date.now();

  // Ignore repeated readings of the same code for 2 seconds
  if (scanCooldown[barcode] && now - scanCooldown[barcode] < 2000) {
    return;
  }
  scanCooldown[barcode] = now;

  if (inventory[barcode]) {
    inventory[barcode].quantity =
      Number(inventory[barcode].quantity || 0) + 1;

    saveDatabase();

    setStatus(
      "✅ " + inventory[barcode].name +
      " +1 (now " + inventory[barcode].quantity + ")"
    );
  } else {
    openNewProduct(barcode);
  }
}

// NEW PRODUCT

function openNewProduct(barcode) {
  pendingBarcode = barcode;
  $("newBarcode").textContent = "Barcode: " + barcode;
  $("productName").value = "";
  $("productQuantity").value = "1";
  $("modal").classList.remove("hidden");

  setStatus("🆕 New barcode detected: " + barcode);
}

function closeModal() {
  $("modal").classList.add("hidden");
  pendingBarcode = null;
}

$("saveProduct").onclick = () => {
  if (!pendingBarcode) return;

  const name = $("productName").value.trim();
  const quantity = Number($("productQuantity").value);

  if (!name) {
    alert("Enter a product name.");
    return;
  }

  if (!Number.isFinite(quantity) || quantity < 0) {
    alert("Enter a valid quantity.");
    return;
  }

  if (!Number.isInteger(quantity)) {
    alert("Quantity must be a whole number.");
    return;
  }

  inventory[pendingBarcode] = {
    barcode: pendingBarcode,
    name,
    quantity
  };

  closeModal();
  saveDatabase();
  setStatus("✅ Saved " + name);
};

$("cancelProduct").onclick = closeModal;

// MANUAL BARCODE ENTRY

$("manualSubmit").onclick = () => {
  const barcode = $("manualBarcode").value.trim();
  if (!barcode) return;

  handleBarcode(barcode);
  $("manualBarcode").value = "";
};

$("manualBarcode").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    $("manualSubmit").click();
  }
});

// SEARCH

$("search").addEventListener("input", render);

// CAMERA DISCOVERY

async function loadCameras() {
  const select = $("cameraSelect");

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
      throw new Error("Camera APIs unavailable");
    }

    const permissionStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    permissionStream.getTracks().forEach(track => track.stop());

    const devices = await navigator.mediaDevices.enumerateDevices();
    cameras = devices.filter(device => device.kind === "videoinput");
    select.innerHTML = "";

    if (!cameras.length) {
      select.innerHTML = '<option value="">No cameras found</option>';
      setStatus("No cameras detected.", true);
      return;
    }

    cameras.forEach((camera, index) => {
      const option = document.createElement("option");
      option.value = camera.deviceId;
      option.textContent = camera.label || `Camera ${index + 1}`;
      select.appendChild(option);
    });

    const rearCamera = cameras.find(camera =>
      /back|rear|environment/i.test(camera.label)
    );

    if (rearCamera) {
      select.value = rearCamera.deviceId;
    } else if (cameras.length > 1) {
      select.selectedIndex = cameras.length - 1;
    }

    setStatus("Camera ready. Press Start camera.");
  } catch (err) {
    console.warn("Camera discovery failed:", err);
    select.innerHTML = '<option value="">Default rear camera</option>';
    setStatus("Press Start camera to open the camera.", true);
  }
}

// START CAMERA (ZXing)

async function startCamera() {
  if (cameraRunning) return;

  if (!window.ZXingBrowser ||
      !window.ZXingBrowser.BrowserMultiFormatReader) {
    setStatus("Scanner library failed to load. Check your internet and reload.", true);
    return;
  }

  const selectedCameraId = $("cameraSelect").value || undefined;

  scanner = new ZXingBrowser.BrowserMultiFormatReader();

  const video = document.createElement("video");
  video.setAttribute("playsinline", "true");
  video.setAttribute("autoplay", "true");
  video.muted = true;
  video.style.width = "100%";
  video.style.maxHeight = "60vh";
  video.style.objectFit = "contain";
  video.style.background = "#090d0a";

  $("reader").replaceChildren(video);

  try {
    setStatus("Starting camera...");

    const controls = await scanner.decodeFromVideoDevice(
      selectedCameraId,
      video,
      (result, error) => {
        if (result) {
          const text = result.getText ? result.getText() : result.text;
          if (text) handleBarcode(text);
        }
      }
    );

    scannerControls = controls;
    cameraRunning = true;
    setStatus("📷 Camera running. Centre the barcode in the camera view.");
  } catch (err) {
    console.error("Camera start error:", err);
    setStatus("Camera failed: " + (err.message || err), true);

    if (scannerControls && scannerControls.stop) {
      scannerControls.stop();
    }

    scannerControls = null;
    scanner = null;
    cameraRunning = false;
    $("reader").replaceChildren();
  }
}

async function stopCamera() {
  if (!cameraRunning && !scannerControls) return;

  try {
    if (scannerControls && scannerControls.stop) {
      scannerControls.stop();
    }

    if (scanner && scanner.reset) {
      scanner.reset();
    }
  } catch (err) {
    console.warn("Camera stop error:", err);
  }

  scannerControls = null;
  scanner = null;
  cameraRunning = false;
  $("reader").replaceChildren();
  setStatus("Camera stopped.");
}

$("startCamera").onclick = startCamera;
$("stopCamera").onclick = stopCamera;

$("cameraSelect").addEventListener("change", async () => {
  if (!cameraRunning) return;
  await stopCamera();
  await startCamera();
});

// EXPORT DATABASE

$("exportBtn").onclick = () => {
  const backup = {
    version: 2,
    exported: new Date().toISOString(),
    products: inventory
  };

  const blob = new Blob(
    [JSON.stringify(backup, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "DB.json";
  link.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

// IMPORT DATABASE

$("importBtn").onclick = () => $("fileInput").click();

$("fileInput").onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const data = JSON.parse(await file.text());
    const products = data.products;

    if (!products || typeof products !== "object" || Array.isArray(products)) {
      throw new Error("Invalid database format.");
    }

    if (!confirm("Replace your current inventory with this backup?")) {
      event.target.value = "";
      return;
    }

    inventory = products;
    saveDatabase();
    setStatus("✅ Database imported.");
  } catch (err) {
    alert("Import failed: " + err.message);
  }

  event.target.value = "";
};

// INITIALIZE

render();
loadCameras();

</script>
</body>
</html>
